<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>COMMAND CENTER</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --g:    #00e676;
      --gdim: #007744;
      --gdk:  #001a0d;
      --red:  #ff1744;
      --bg:   #04090b;
      --border: rgba(0,230,118,0.25);
    }

    body {
      background: var(--bg);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      color: var(--g);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px
      );
      pointer-events: none;
      z-index: 9000;
    }

    /* Vignette */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 50%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 9001;
    }

    #scene {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px 36px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: relative;
    }

    /* ── Header ───────────────────────────────────────── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .classification {
      font-size: 10px;
      letter-spacing: 7px;
      color: var(--red);
      text-shadow: 0 0 12px var(--red);
      border: 1px solid var(--red);
      padding: 3px 16px;
      animation: redPulse 2s infinite alternate;
    }
    @keyframes redPulse {
      from { box-shadow: 0 0 4px var(--red); }
      to   { box-shadow: 0 0 14px var(--red); }
    }

    .title {
      font-size: clamp(22px, 6vw, 30px);
      letter-spacing: 8px;
      text-shadow: 0 0 20px var(--g), 0 0 40px rgba(0,230,118,0.4);
    }

    .subtitle {
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--gdim);
    }

    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gdim);
      font-size: 13px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gdim), transparent);
      opacity: 0.5;
    }

    /* ── Nav cards ────────────────────────────────────── */
    .nav-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 22px;
      border: 3px solid rgba(0,230,118,0.5);
      border-radius: 60px;
      background: linear-gradient(145deg, #005533, #002a1a);
      text-decoration: none;
      color: #fff;
      position: relative;
      transition: transform 0.1s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,230,118,0.2), inset 0 1px 0 rgba(0,230,118,0.15);
    }
    .nav-card:active,
    .nav-card:hover {
      transform: scale(0.97);
      box-shadow: 0 2px 10px rgba(0,230,118,0.2);
    }
    .nav-card.bomb {
      border-color: rgba(255,80,0,0.6);
      background: linear-gradient(145deg, #882200, #440f00);
      box-shadow: 0 6px 24px rgba(255,80,0,0.2), inset 0 1px 0 rgba(255,120,0,0.15);
    }
    .nav-card.bomb:active,
    .nav-card.bomb:hover {
      box-shadow: 0 2px 10px rgba(255,80,0,0.2);
    }

    /* Sweep animation on hover/tap */
    .nav-card .sweep {
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg,
        transparent, rgba(0,230,118,0.15), transparent);
      pointer-events: none;
      transition: left 0s;
    }
    .nav-card:hover .sweep,
    .nav-card:active .sweep {
      animation: sweepAnim 0.5s ease-out forwards;
    }
    @keyframes sweepAnim {
      from { left: -60%; }
      to   { left: 140%; }
    }

    .nav-icon {
      font-size: clamp(36px, 10vw, 48px);
      line-height: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(0,230,118,0.5));
    }
    .nav-card.bomb .nav-icon {
      filter: drop-shadow(0 0 8px rgba(255,80,0,0.6));
    }

    .nav-text {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .nav-label {
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 900;
      letter-spacing: 5px;
    }
    .nav-desc {
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.5);
    }
    .nav-card.bomb .nav-label {
      color: #fff;
    }
    .nav-card.bomb .nav-desc {
      color: rgba(255,255,255,0.4);
    }

    .nav-arrow {
      margin-left: auto;
      font-size: 18px;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
    }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      display: flex;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 4px;
      color: var(--gdim);
      opacity: 0.5;
    }

    /* Blinking cursor */
    .blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>

<div id="scene">

  <div class="header">
    <div class="classification">TOP SECRET</div>
    <div class="title">COMMAND CENTER</div>
    <div class="subtitle">WÄHLE EINE OPTION<span class="blink">_</span></div>
    <div class="divider">
      <div class="divider-line"></div>
      <span>◆</span>
      <div class="divider-line"></div>
    </div>
  </div>

  <nav class="nav-grid">

    <a class="nav-card" href="mission.html">
      <div class="sweep"></div>
      <div class="nav-icon">🕵️</div>
      <div class="nav-text">
        <div class="nav-label">MISSION</div>
        <div class="nav-desc">BRIEFING · ZUGANGSCODE · LEVEL-5</div>
      </div>
      <div class="nav-arrow">›</div>
    </a>

    <a class="nav-card bomb" href="bombe.html">
      <div class="sweep"></div>
      <div class="nav-icon">💣</div>
      <div class="nav-text">
        <div class="nav-label">BOMBE</div>
        <div class="nav-desc">COUNTDOWN · ZÜNDEN · EXPLOSION</div>
      </div>
      <div class="nav-arrow">›</div>
    </a>

  </nav>

  <div class="footer">SYSTEM BEREIT &nbsp;·&nbsp; ZUGANG AUTORISIERT</div>

</div>

</body>
</html>

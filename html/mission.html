<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MISSION</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --g:    #00e676;
      --gdim: #007744;
      --gdk:  #001a0d;
      --red:  #ff1744;
      --bg:   #04090b;
      --border: rgba(0,230,118,0.25);
    }

    body {
      background: var(--bg);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      color: var(--g);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px
      );
      pointer-events: none;
      z-index: 9000;
    }

    /* Vignette */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 50%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 9001;
    }

    #scene {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      position: relative;
    }

    /* ── Header ────────────────────────────────────── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .classification {
      font-size: 10px;
      letter-spacing: 7px;
      color: var(--red);
      text-shadow: 0 0 12px var(--red);
      border: 1px solid var(--red);
      padding: 3px 16px;
      animation: redPulse 2s infinite alternate;
    }
    @keyframes redPulse {
      from { box-shadow: 0 0 4px var(--red); }
      to   { box-shadow: 0 0 14px var(--red); }
    }

    .title {
      font-size: clamp(20px, 5.5vw, 28px);
      letter-spacing: 8px;
      text-shadow: 0 0 20px var(--g), 0 0 40px rgba(0,230,118,0.4);
    }

    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gdim);
      font-size: 13px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gdim), transparent);
      opacity: 0.5;
    }

    /* ── Info panel ────────────────────────────────── */
    .info-panel {
      border: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: rgba(0,230,118,0.02);
      position: relative;
    }
    .info-panel::before {
      content: 'SYS_INFO';
      position: absolute;
      top: -8px; left: 14px;
      background: var(--bg);
      padding: 0 6px;
      font-size: 9px;
      letter-spacing: 4px;
      color: var(--gdim);
    }
    /* corner brackets */
    .info-panel::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 10px; height: 10px;
      border-right: 2px solid var(--gdim);
      border-bottom: 2px solid var(--gdim);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .info-row .lbl { color: var(--gdim); }
    .info-row .val {
      color: var(--g);
      text-shadow: 0 0 8px var(--g);
    }
    .info-row .val.red {
      color: var(--red);
      text-shadow: 0 0 8px var(--red);
    }

    /* Blinking cursor */
    .blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Code section ──────────────────────────────── */
    .code-label {
      font-size: 10px;
      letter-spacing: 6px;
      color: var(--gdim);
      text-align: center;
    }

    #code-display {
      display: flex;
      justify-content: center;
      gap: 14px;
      touch-action: none;
      cursor: default;
    }

    .digit-slot {
      width: clamp(74px, 21vw, 96px);
      height: clamp(90px, 26vw, 116px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(50px, 14vw, 68px);
      font-weight: 900;
      border: 1px solid var(--gdim);
      color: var(--g);
      text-shadow: 0 0 18px var(--g), 0 0 36px rgba(0,230,118,0.3);
      background: rgba(0,230,118,0.03);
      cursor: grab;
      position: relative;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .digit-slot:active { cursor: grabbing; }

    /* Techno corner brackets */
    .digit-slot::before,
    .digit-slot::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      border-color: var(--g);
      border-style: solid;
    }
    .digit-slot::before { top: -1px; left: -1px;   border-width: 2px 0 0 2px; }
    .digit-slot::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .digit-slot.drag-over {
      border-color: var(--g);
      background: rgba(0,230,118,0.1);
      transform: scale(1.04);
    }
    .digit-slot.dragging-src {
      opacity: 0.25;
    }
    .digit-slot.concealed {
      color: var(--red);
      text-shadow: 0 0 14px var(--red);
      font-size: clamp(30px, 9vw, 44px);
      letter-spacing: 4px;
    }
    .digit-slot.empty {
      color: var(--gdim);
      font-size: 26px;
      letter-spacing: 2px;
      font-weight: normal;
      text-shadow: none;
      cursor: default;
    }

    /* Ghost while dragging */
    #drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.9;
      transform: scale(1.1);
      box-shadow: 0 0 24px rgba(0,230,118,0.5);
    }

    .code-hint {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--gdim);
      text-align: center;
      opacity: 0.6;
    }

    /* ── Mission Button ────────────────────────────── */
    #mission-btn {
      background: transparent;
      color: var(--g);
      border: 1px solid var(--g);
      padding: 17px 0;
      font-family: 'Courier New', monospace;
      font-size: clamp(13px, 3.8vw, 17px);
      font-weight: 700;
      letter-spacing: 6px;
      cursor: pointer;
      width: 100%;
      text-shadow: 0 0 10px var(--g);
      box-shadow: 0 0 20px rgba(0,230,118,0.08), inset 0 0 20px rgba(0,230,118,0.03);
      transition: background 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: relative;
      overflow: hidden;
    }
    #mission-btn:active {
      background: rgba(0,230,118,0.08);
      box-shadow: 0 0 30px rgba(0,230,118,0.25);
    }
    /* scan sweep on click */
    #mission-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg,
        transparent, rgba(0,230,118,0.2), transparent);
    }
    #mission-btn.scanning::after {
      animation: btnSweep 0.55s ease-out;
    }
    @keyframes btnSweep {
      from { left: -60%; }
      to   { left: 140%; }
    }

    /* digit scramble highlight */
    .digit-slot.scrambling {
      color: var(--g);
    }
    @keyframes slotIn {
      0%   { transform: scaleY(0); opacity: 0; }
      70%  { transform: scaleY(1.06); }
      100% { transform: scaleY(1); opacity: 1; }
    }
    .digit-slot.slot-in {
      animation: slotIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body>

<div id="scene">

  <!-- Header -->
  <div class="header">
    <div class="classification">TOP SECRET</div>
    <div class="title">MISSION BRIEFING</div>
    <div class="divider">
      <div class="divider-line"></div>
      <span>◆</span>
      <div class="divider-line"></div>
    </div>
  </div>

  <!-- System info -->
  <div class="info-panel">
    <div class="info-row">
      <span class="lbl">AGENT</span>
      <span class="val">███████<span class="blink">_</span></span>
    </div>
    <div class="info-row">
      <span class="lbl">CLEARANCE</span>
      <span class="val">LEVEL-5</span>
    </div>
    <div class="info-row">
      <span class="lbl">STATUS</span>
      <span class="val" id="status-val">STANDBY</span>
    </div>
    <div class="info-row">
      <span class="lbl">PROTOKOLL</span>
      <span class="val">AES-256-GCM</span>
    </div>
  </div>

  <!-- Code display -->
  <div style="display:flex;flex-direction:column;gap:14px;">
    <div class="code-label">ZUGANGSCODE</div>
    <div id="code-display">
      <div class="digit-slot empty" data-index="0">—</div>
      <div class="digit-slot empty" data-index="1">—</div>
      <div class="digit-slot empty" data-index="2">—</div>
    </div>
    <div class="code-hint">TIPPEN ZUM VERBERGEN &nbsp;·&nbsp; ZIEHEN ZUM SORTIEREN</div>
  </div>

  <button id="mission-btn" onclick="generateCode()">MISSION STARTEN</button>

</div>

<script>
  let code = [];
  let concealed = false;
  let pointerState = null;
  let ghost = null;
  let scrambleTimers = [];

  // ── Render ───────────────────────────────────────────
  function renderCode(skipAnimation) {
    document.querySelectorAll('.digit-slot').forEach((slot, i) => {
      slot.classList.remove('empty', 'concealed', 'scrambling');
      if (code.length === 0) {
        slot.textContent = '—';
        slot.classList.add('empty');
      } else if (concealed) {
        slot.textContent = '███';
        slot.classList.add('concealed');
      } else {
        slot.textContent = code[i];
        if (!skipAnimation) {
          slot.classList.add('slot-in');
          slot.addEventListener('animationend', () => slot.classList.remove('slot-in'), {once: true});
        }
      }
    });
  }

  // ── Generate ─────────────────────────────────────────
  function generateCode() {
    // Clear any running scrambles
    scrambleTimers.forEach(t => clearInterval(t.iv) || clearTimeout(t.to));
    scrambleTimers = [];

    code = Array.from({length: 3}, () => Math.floor(Math.random() * 10));
    concealed = false;

    const btn = document.getElementById('mission-btn');
    btn.classList.remove('scanning');
    void btn.offsetWidth; // reflow to restart animation
    btn.classList.add('scanning');

    document.getElementById('status-val').textContent = 'INITIALISIERUNG...';
    document.getElementById('status-val').classList.remove('red');

    const slots = document.querySelectorAll('.digit-slot');
    slots.forEach((slot, i) => {
      slot.classList.remove('empty', 'concealed');

      const startDelay = i * 100;
      const steps = 10 + i * 4;
      let count = 0;

      const to = setTimeout(() => {
        slot.classList.add('scrambling');
        const iv = setInterval(() => {
          slot.textContent = Math.floor(Math.random() * 10);
          count++;
          if (count >= steps) {
            clearInterval(iv);
            slot.classList.remove('scrambling');
            slot.textContent = code[i];
            if (i === 2) {
              document.getElementById('status-val').textContent = 'AKTIV';
              document.getElementById('status-val').classList.add('red');
            }
          }
        }, 55);
        scrambleTimers.push({iv});
      }, startDelay);
      scrambleTimers.push({to});
    });
  }

  // ── Pointer drag & tap ───────────────────────────────
  document.getElementById('code-display').addEventListener('pointerdown', e => {
    const slot = e.target.closest('.digit-slot');
    if (!slot || code.length === 0) return;
    e.preventDefault();
    const rect = slot.getBoundingClientRect();
    pointerState = {
      index:  parseInt(slot.dataset.index),
      startX: e.clientX,
      startY: e.clientY,
      offX:   e.clientX - rect.left,
      offY:   e.clientY - rect.top,
      rect,
      moved:  false,
    };
  });

  document.addEventListener('pointermove', e => {
    if (!pointerState) return;
    const dx = e.clientX - pointerState.startX;
    const dy = e.clientY - pointerState.startY;

    if (!pointerState.moved && Math.hypot(dx, dy) > 8) {
      pointerState.moved = true;
      spawnGhost(pointerState.index, pointerState.rect);
    }

    if (pointerState.moved && ghost) {
      ghost.style.left = (e.clientX - pointerState.offX) + 'px';
      ghost.style.top  = (e.clientY - pointerState.offY) + 'px';
      refreshDragOver(e.clientX, e.clientY);
    }
  });

  document.addEventListener('pointerup', e => {
    if (!pointerState) return;

    if (!pointerState.moved) {
      // tap = toggle visibility
      concealed = !concealed;
      renderCode(true);
    } else {
      const target = slotAt(e.clientX, e.clientY);
      if (target !== null && target !== pointerState.index) {
        [code[pointerState.index], code[target]] = [code[target], code[pointerState.index]];
      }
      killGhost();
      clearDragOver();
      renderCode(true);
    }
    pointerState = null;
  });

  document.addEventListener('pointercancel', () => {
    if (!pointerState) return;
    if (pointerState.moved) { killGhost(); clearDragOver(); renderCode(true); }
    pointerState = null;
  });

  // ── Ghost helpers ────────────────────────────────────
  function spawnGhost(index, rect) {
    const src = document.querySelector(`.digit-slot[data-index="${index}"]`);
    ghost = src.cloneNode(true);
    ghost.id = 'drag-ghost';
    ghost.style.cssText = `
      position:fixed;
      width:${rect.width}px;
      height:${rect.height}px;
      left:${rect.left}px;
      top:${rect.top}px;
      pointer-events:none;
      z-index:9999;
      opacity:0.9;
      transform:scale(1.1);
      box-shadow:0 0 24px rgba(0,230,118,0.5);
    `;
    document.body.appendChild(ghost);
    src.classList.add('dragging-src');
  }

  function killGhost() {
    if (ghost) { ghost.remove(); ghost = null; }
    document.querySelectorAll('.digit-slot.dragging-src')
      .forEach(s => s.classList.remove('dragging-src'));
  }

  function refreshDragOver(x, y) {
    clearDragOver();
    const idx = slotAt(x, y);
    if (idx !== null && idx !== pointerState.index) {
      document.querySelector(`.digit-slot[data-index="${idx}"]`)
        .classList.add('drag-over');
    }
  }

  function clearDragOver() {
    document.querySelectorAll('.digit-slot.drag-over')
      .forEach(s => s.classList.remove('drag-over'));
  }

  function slotAt(x, y) {
    for (const slot of document.querySelectorAll('.digit-slot')) {
      const r = slot.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom)
        return parseInt(slot.dataset.index);
    }
    return null;
  }
</script>
</body>
</html>
